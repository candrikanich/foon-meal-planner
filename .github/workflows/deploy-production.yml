name: Deploy production

# Applies migrations (and the idempotent starter catalog) to Foon production and deploys Edge Functions. Unlike
# staging it never runs on a merge: someone starts it from main, types "production", and approves the `production`
# environment. This is the only way schema reaches production: never `supabase db push` from a laptop.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type production to deploy main to Foon production
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate and deploy functions (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # Passed through env rather than interpolated into the script, so the typed text can't run as shell.
      CONFIRM: ${{ inputs.confirm }}
      # Foon production. The same account holds other products' databases, so a wrong secret must stop here.
      EXPECTED_REF: itnhdikhdsujklaimqqd
    steps:
      - name: Refuse anything but main, confirmed, to Foon production
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production deploys only from main, not $GITHUB_REF. Nothing was deployed."
            exit 1
          fi
          if [ "$CONFIRM" != "production" ]; then
            echo "::error::Type production to confirm. Nothing was deployed."
            exit 1
          fi
          if [ "$PROJECT_REF" != "$EXPECTED_REF" ]; then
            echo "::error::SUPABASE_PROJECT_REF is not Foon production ($EXPECTED_REF). Nothing was deployed."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      - name: Link
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Migrations and starter catalog
        run: supabase db push --include-seed --password "$SUPABASE_DB_PASSWORD"

      - name: Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apple:
    name: Build and test (iOS + macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - uses: actions/cache@v6
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ hashFiles('Foon.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Build iOS
        run: >
          xcodebuild build -project Foon.xcodeproj -scheme Foon
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/DerivedData -quiet CODE_SIGNING_ALLOWED=NO

      - name: Build macOS
        run: >
          xcodebuild build -project Foon.xcodeproj -scheme Foon
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath build/DerivedData -quiet CODE_SIGNING_ALLOWED=NO

      # Hosted macOS runners have no Docker, so SupabaseLocalStackTests stays skipped here.
      - name: Unit tests (Swift Testing, macOS)
        run: scripts/test.sh

      - name: String Catalog has every string
        run: scripts/sync-strings.sh --check

  database:
    name: Migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      - name: Start database
        run: supabase db start

      - name: Apply migrations and seed from scratch
        run: supabase db reset

      - name: pgTAP tests
        run: supabase test db

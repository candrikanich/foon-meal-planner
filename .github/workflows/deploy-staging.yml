name: Deploy staging

# Applies migrations (and the idempotent starter catalog) to hosted staging and deploys Edge Functions after a
# merge to main. This is the only way schema reaches a hosted project: never `supabase db push` from a laptop.

on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/**
      - supabase/functions/**
      - supabase/seed/**
      - supabase/config.toml
      - .github/workflows/deploy-staging.yml
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate and deploy functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # Foon staging (org wxaodzxjkzimkvienaug). The same account holds other products' databases, so a wrong
      # secret must stop here rather than migrate someone else's project.
      EXPECTED_REF: cbftcssbnfdjjxoeflvj
    steps:
      - name: Refuse any project but Foon staging
        run: |
          if [ "$PROJECT_REF" != "$EXPECTED_REF" ]; then
            echo "::error::SUPABASE_PROJECT_REF is not Foon staging ($EXPECTED_REF). Nothing was deployed."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      - name: Link
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Migrations and starter catalog
        run: supabase db push --include-seed --password "$SUPABASE_DB_PASSWORD"

      - name: Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"

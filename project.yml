name: Foon

options:
  bundleIdPrefix: com.andrikanich
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Debug → local Supabase, Staging → hosted staging, Release → prod.
configs:
  Debug: debug
  Staging: release
  Release: release

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # The Recruiting Compass LLC publishes Foon for now; see planning/m0-foundation-plan.md.
    DEVELOPMENT_TEAM: G374A783RH

targets:
  Foon:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Foon
        excludes: ["**/.gitkeep"]
    dependencies:
      - package: Supabase
    configFiles:
      Debug: Config/Local.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Prod.xcconfig
    entitlements:
      path: Foon/App/Foon.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Foon/App/Info.plist
      properties:
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrikanich.foon
        PRODUCT_NAME: Foon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Foon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_HARDENED_RUNTIME: YES

  FoonTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [FoonTests]
    dependencies:
      - target: Foon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrikanich.foon.tests
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen emits the iOS host path for multi-destination targets; macOS bundles nest the binary.
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/Foon.app/Contents/MacOS/Foon

schemes:
  Foon:
    build:
      targets:
        Foon: all
        FoonTests: [test]
    test:
      targets: [FoonTests]
      gatherCoverageData: true
